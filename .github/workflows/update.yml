name: Update stock dashboard

# 毎週月曜 0:00(UTC) に自動実行 ＋ 手動実行ボタン
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # index.html をコミットして書き戻すため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 最新データで index.html を生成
        env:
          # FRED APIキー（あれば使う／無ければキー無しCSVで同じデータ）
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "chore: update dashboard ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "変更なし。スキップします。"
          fi
